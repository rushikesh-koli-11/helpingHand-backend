spring.application.name=HelpingHands
spring.datasource.url=jdbc:sqlserver://127.0.0.1;databaseName=HelpingHands;encrypt=true;trustServerCertificate=true
spring.datasource.username=your-username
spring.datasource.password=your-username
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = create-drop
#spring.jpa.hibernate.ddl-auto=update
#This will create or update the schema (if necessary)

spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.SQLServer2012Dialect
#"jdbc:sqlserver://localhost:1433;databaseName=student;";
management.endpoints.web.exposure.include=*
spring.thymeleaf.enabled=true
# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=C:/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
project.image=files/

server.port=8080
upload.path=C:/uploads/

stripe.api.key=your-stripe-api-key
openai.api.key=your-openai-api-key

recaptcha.secret=your-recaptcha-secret-key


